<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Nutrition Coach</title>
<style>
:root{
  --bg:#0f1115;
  --bg-elev:#171a21;
  --card:#1c2029;
  --card-2:#20242e;
  --border:#2a2f3a;
  --text:#f2f3f5;
  --text-dim:#9aa1ae;
  --text-faint:#6b7280;
  --accent:#34d399;
  --accent-2:#22c55e;
  --accent-soft:rgba(52,211,153,0.14);
  --blue:#60a5fa;
  --orange:#fbbf24;
  --red:#f87171;
  --purple:#c084fc;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(0,0,0,0.35);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(84px + var(--safe-bottom));background:linear-gradient(180deg,#12141a 0%, var(--bg) 220px);}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,17,21,0.85);backdrop-filter:blur(14px);padding:18px 20px 12px;border-bottom:1px solid var(--border);}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
.topbar .sub{font-size:13px;color:var(--text-dim);margin-top:2px;}
main{padding:18px 16px 8px;}
.screen{display:none;animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);font-weight:700;margin-bottom:10px;}

/* Home hero */
.hero{background:linear-gradient(160deg,#1a2b24,#161a22 60%);border:1px solid var(--border);border-radius:22px;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden;}
.hero-label{font-size:13px;color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:6px;}
.hero-kcal{font-size:44px;font-weight:800;letter-spacing:-0.03em;margin-top:6px;display:flex;align-items:baseline;gap:8px;}
.hero-kcal .goal{font-size:18px;color:var(--text-dim);font-weight:600;}
.progress-wrap{margin-top:16px;}
.progress-bar{height:12px;border-radius:20px;background:#262b35;overflow:hidden;position:relative;}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s ease;}
.progress-fill.over{background:linear-gradient(90deg,#f59e0b,#f87171);}
.progress-caption{margin-top:8px;font-size:13px;color:var(--text-dim);font-weight:600;}

.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
.macro-pill{background:var(--card-2);border-radius:14px;padding:10px 8px;text-align:center;border:1px solid var(--border);}
.macro-pill .ico{font-size:18px;}
.macro-pill .val{font-size:15px;font-weight:800;margin-top:2px;}
.macro-pill .lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}

.section-title{font-size:15px;font-weight:800;margin:22px 0 10px;letter-spacing:-0.01em;}

.meal-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.meal-row .meal-left{display:flex;align-items:center;gap:12px;}
.meal-emoji{font-size:22px;width:38px;height:38px;background:var(--card-2);border-radius:12px;display:flex;align-items:center;justify-content:center;}
.meal-name{font-weight:700;font-size:14.5px;}
.meal-items{font-size:12px;color:var(--text-dim);margin-top:2px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meal-kcal{font-weight:800;font-size:15px;}
.meal-kcal .u{font-size:11px;color:var(--text-dim);font-weight:600;}

.big-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.big-btn{border:none;border-radius:20px;padding:20px 12px;font-weight:800;font-size:14.5px;color:#0d1410;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .12s ease;}
.big-btn:active{transform:scale(0.97);}
.big-btn.primary{background:linear-gradient(160deg,var(--accent),#10b981);}
.big-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.big-btn .emoji{font-size:26px;}

/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .1s ease, opacity .15s;}
.btn:active{transform:scale(0.97);}
.btn-accent{background:linear-gradient(160deg,var(--accent),#10b981);color:#0d1410;}
.btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:rgba(248,113,113,0.14);color:var(--red);border:1px solid rgba(248,113,113,0.3);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;}
.btn:disabled{opacity:.45;pointer-events:none;}

/* forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.input,select{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;}
.input:focus,select:focus{outline:none;border-color:var(--accent);}
.qty-stepper{display:flex;align-items:center;gap:10px;}
.qty-stepper button{width:40px;height:40px;border-radius:12px;background:var(--card-2);border:1px solid var(--border);color:var(--text);font-size:19px;font-weight:800;cursor:pointer;}
.qty-stepper input{flex:1;text-align:center;}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;}
.choice-chip{padding:10px 14px;border-radius:12px;background:var(--card-2);border:1px solid var(--border);font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text);}
.choice-chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;}
.badge-green{background:rgba(52,211,153,0.14);color:var(--accent);}
.badge-yellow{background:rgba(251,191,36,0.14);color:var(--orange);}
.badge-red{background:rgba(248,113,113,0.14);color:var(--red);}

/* food identified rows */
.food-id-row{background:var(--card-2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;}
.food-id-top{display:flex;justify-content:space-between;align-items:flex-start;}
.food-id-name{font-weight:800;font-size:15px;}
.food-id-qty{color:var(--text-dim);font-size:13px;margin-top:3px;}
.food-id-actions{display:flex;gap:8px;margin-top:10px;}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}

/* search results */
.search-result{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.search-result:last-child{border-bottom:none;}
.search-result .srname{font-weight:700;font-size:14.5px;}
.search-result .srsub{font-size:12px;color:var(--text-dim);}

/* photo screen */
.photo-drop{border:2px dashed var(--border);border-radius:22px;padding:34px 18px;text-align:center;background:var(--card);margin-bottom:16px;}
.photo-drop img{width:100%;border-radius:16px;margin-top:10px;max-height:280px;object-fit:cover;}
.photo-drop-icon{font-size:38px;}
.photo-drop p{color:var(--text-dim);font-size:13.5px;margin-top:8px;}
.analyzing{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--accent);animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* bottom nav */
#bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(18,20,26,0.92);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:8px 4px calc(8px + var(--safe-bottom));z-index:30;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:none;color:var(--text-faint);cursor:pointer;}
.nav-item .ic{font-size:21px;}
.nav-item .tx{font-size:10.5px;font-weight:700;}
.nav-item.active{color:var(--accent);}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--bg-elev);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + var(--safe-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:14px;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--card-2);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;font-size:16px;cursor:pointer;}

.info-box{background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.25);border-radius:14px;padding:13px 14px;font-size:13px;color:#cfe0fb;line-height:1.5;margin-bottom:14px;}
.warn-box{background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);border-radius:14px;padding:13px 14px;font-size:13px;color:#ffe6ad;line-height:1.5;margin-bottom:14px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:13.5px;}
.empty-state .em{font-size:32px;margin-bottom:8px;}

.tag-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.tag-row::-webkit-scrollbar{display:none;}
.tag-chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card-2);border:1px solid var(--border);font-size:12.5px;font-weight:700;cursor:pointer;}
.tag-chip.active{background:var(--accent);color:#0d1410;border-color:var(--accent);}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#232833;border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:200;box-shadow:var(--shadow);animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
canvas{width:100%;display:block;}

.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-weight:700;font-size:14.5px;}
.settings-row .val{color:var(--text-dim);font-size:13px;}

.recipe-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.recipe-card h4{font-size:15.5px;font-weight:800;}
.recipe-card .rk{color:var(--text-dim);font-size:12.5px;margin-top:3px;}

.confidence-line{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-dim);}
.small{font-size:12px;color:var(--text-faint);}
.link-btn{background:none;border:none;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;padding:2px 0;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="topbarTitle">Mon Nutrition Coach</h1>
    <div class="sub" id="topbarSub">Aujourd'hui</div>
  </header>

  <main id="screens">
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-add"></section>
    <section class="screen" id="screen-photo"></section>
    <section class="screen" id="screen-history"></section>
    <section class="screen" id="screen-profile"></section>
  </main>

  <nav id="bottomnav">
    <button class="nav-item active" data-screen="home"><span class="ic">🏠</span><span class="tx">Accueil</span></button>
    <button class="nav-item" data-screen="add"><span class="ic">➕</span><span class="tx">Ajouter</span></button>
    <button class="nav-item" data-screen="photo"><span class="ic">📸</span><span class="tx">Photo</span></button>

    <button class="nav-item" data-screen="profile"><span class="ic">⚙️</span><span class="tx">Profil</span></button>
  </nav>

  <div id="modal-root"></div>
</div>

const UNITS = [
  {v:'g',l:'grammes'}, {v:'kg',l:'kilogrammes'}, {v:'ml',l:'millilitres'}, {v:'l',l:'litres'},
  {v:'unite',l:'unité'}, {v:'cs',l:'cuillère à soupe'}, {v:'cc',l:'cuillère à café'},
  {v:'tranche',l:'tranche'}, {v:'portion',l:'portion'}, {v:'poignee',l:'poignée'}
];
const UNIT_TO_GRAMS = {g:1, kg:1000, ml:1, l:1000, cs:15, cc:5, tranche:30, portion:100, poignee:30, unite:null};

function todayKey(d){
  const date = d || new Date();
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}

/* ---------- 3. UTILITAIRES NUTRITION ---------- */
function allFoods(){ return FOOD_DB.concat(STATE.customFoods); }
function findFood(id){ return allFoods().find(f=>f.id===id); }

function gramsFor(item){
  // item: {foodId, qty, unit}
  const food = findFood(item.foodId);
  if(!food) return item.qty;
  if(item.unit==='unite'){
    return item.qty * (food.gramsPerUnit || 100);
  }
  const mult = UNIT_TO_GRAMS[item.unit];
  return item.qty * (mult==null?1:mult);
}
function computeItemMacros(item){
  const food = findFood(item.foodId);
  if(!food) return {kcal:0,p:0,c:0,f:0,fib:0};
  const g = gramsFor(item);
  const ratio = g/100;
  return {
    kcal: food.kcal*ratio, p: food.p*ratio, c: food.c*ratio, f: food.f*ratio, fib: (food.fib||0)*ratio
  };
}
function sumMeal(meal){
  return meal.items.reduce((acc,it)=>{
    const m = it.rangeKcal ? {kcal:(it.rangeKcal[0]+it.rangeKcal[1])/2, p:it.p||0,c:it.c||0,f:it.f||0,fib:it.fib||0} : computeItemMacros(it);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f; acc.fib+=m.fib;
    return acc;
  },{kcal:0,p:0,c:0,f:0,fib:0});
}
function sumDay(key){
  const meals = dayMeals(key);
  return meals.reduce((acc,meal)=>{
    const m = sumMeal(meal);
    acc.kcal+=m.kcal; acc.p+=m.p; acc.c+=m.c; acc.f+=m.f; acc.fib+=m.fib;
    return acc;
  },{kcal:0,p:0,c:0,f:0,fib:0});
}
function round(n){ return Math.round(n); }

// Assistant texte libre — détection simple par mots-clés + quantités
function parseAssistantText(text){
  if(!text || !text.trim()){ toast('Écris une phrase à analyser'); return; }
  const lower = text.toLowerCase();
  const numberWords = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10};
  const foods = allFoods();
  const found = [];
  // recherche par nom de base (sans distinction cru/cuit) pour éviter les doublons
  const bases = {};
  foods.forEach(f=>{ const base=f.name.toLowerCase().split(' (')[0]; if(!bases[base]) bases[base]=[]; bases[base].push(f); });
  Object.keys(bases).forEach(base=>{
    const idx = lower.indexOf(base.split(' ')[0]); // recherche du premier mot du nom
    if(idx>-1){
      // chercher un nombre juste avant
      const before = lower.slice(Math.max(0,idx-25), idx);
      let qty=null, unit=null;
      const numMatch = before.match(/(\d+[.,]?\d*)\s*(cuillères? à soupe|cuillères? à café|g|grammes?|kg|ml|l)?\s*(?:de|d')?\s*$/);
      if(numMatch){ qty=parseFloat(numMatch[1].replace(',','.')); if(numMatch[2]){ if(numMatch[2].includes('soupe'))unit='cs'; else if(numMatch[2].includes('café'))unit='cc'; else if(numMatch[2].startsWith('kg'))unit='kg'; else if(numMatch[2].startsWith('ml'))unit='ml'; else if(numMatch[2].startsWith('l'))unit='l'; else unit='g'; } }
      else {
        for(const w in numberWords){ if(before.trim().endsWith(w)){ qty=numberWords[w]; } }
      }
      found.push({base, candidates:bases[base], qty, unit});
    }
  });
  if(!found.length){ toast('Je n\'ai reconnu aucun aliment, essaie l\'ajout manuel'); return; }
  askAssistantFollowUps(found, 0);
}
function askAssistantFollowUps(found, i){
  if(i>=found.length){ renderDraftItems(); toast(found.length+' aliment(s) ajouté(s), vérifie les quantités'); return; }
  const entry = found[i];
  const candidates = entry.candidates;
  const isCountable = candidates[0].unit==='unite';
  const defaultUnit = isCountable ? 'unite' : (entry.unit || 'g');
  const defaultQty = entry.qty || (isCountable?1:100);
  function proceedWithFood(food){
    const item = {id:'it_'+Date.now()+Math.random().toString(36).slice(2,6), foodId:food.id, name:food.name, qty:defaultQty, unit:defaultUnit, state:food.state, estimation:!entry.qty};
    addDraft.items.push(item);
    askAssistantFollowUps(found, i+1);
  }
  if(candidates.length>1){
    // état cru/cuit inconnu -> question
    showModal(`
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">${capitalize(entry.base)}</div>
      <p class="small" style="margin-bottom:12px;">Est-ce pesé cru ou cuit ?</p>
      <div class="choice-row" id="stateChoice">
        ${candidates.map(c=>`<div class="choice-chip" data-id="${c.id}">${c.state}</div>`).join('')}
        <div class="choice-chip" data-id="__unknown">Je ne sais pas</div>
      </div>
    `, ()=>{
      document.querySelectorAll('#stateChoice .choice-chip').forEach(chip=>{
        chip.addEventListener('click',()=>{
          closeModal();
          const food = chip.dataset.id==='__unknown' ? candidates[0] : candidates.find(c=>c.id===chip.dataset.id);
          proceedWithFood(food);
        });
      });
    });
  } else {
    proceedWithFood(candidates[0]);
  }
}

function handlePhotoFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{ photoState.dataUrl = ev.target.result; photoState.step='preview'; renderPhoto(); };
  reader.readAsDataURL(file);
}

async function runAnalysis(){
  if(!hasApiKey()){
    promptForApiKey(()=>runAnalysis());
    return;
  }
  photoState.step='analyzing'; renderPhoto();
  try{
    const items = STATE.apiProvider==='gemini'
      ? await analyzeWithGemini(photoState.dataUrl, STATE.geminiKey)
      : await analyzeWithAnthropic(photoState.dataUrl, STATE.apiKey);
    photoState.identified = items;
    photoState.mode='ia';
    photoState.errorMsg = null;
  }catch(err){
    // Ne jamais simuler un résultat : en cas d'échec, on le dit clairement.
    photoState.identified = [];
    photoState.mode='error';
    photoState.errorMsg = err.message;
  }
  photoState.reviewItems = null; // reconstruire la liste à partir du nouveau résultat
  photoState.step='review';
  renderPhoto();
}

// Option 1 (gratuite) — Google Gemini, nécessite une clé obtenue sur aistudio.google.com
async function analyzeWithGemini(dataUrl, apiKey){
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));
  const model = 'gemini-3.5-flash';
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{parts:[
        {text:'Identifie les aliments visibles sur cette photo de repas. Réponds UNIQUEMENT avec un JSON valide, sans texte autour, sous la forme : [{"name":"Poulet","qtyMinG":250,"qtyMaxG":300,"confidence":"yellow"}]. confidence est "green" (bonne visibilité), "yellow" (estimation approximative) ou "red" (information insuffisante). Ne donne jamais un poids unique et précis, toujours une fourchette.'},
        {inline_data:{mime_type:mediaType, data:base64}}
      ]}]
    })
  });
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    throw new Error('requête Gemini échouée ('+resp.status+')'+(errBody?(' — '+errBody.slice(0,120)):''));
  }
  const data = await resp.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).filter(Boolean).join('') || '';
  if(!text) throw new Error('réponse vide');
  const clean = text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  return parsed.map(p=>({name:p.name, qtyMinG:p.qtyMinG, qtyMaxG:p.qtyMaxG, confidence:p.confidence||'yellow'}));
}

// Option 2 (payante à l'usage) — Anthropic
async function analyzeWithAnthropic(dataUrl, apiKey){
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(';'));
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user', content:[
        {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
        {type:'text', text:'Identifie les aliments visibles sur cette photo de repas. Réponds UNIQUEMENT avec un JSON valide, sans texte autour, sous la forme : [{"name":"Poulet","qtyMinG":250,"qtyMaxG":300,"confidence":"yellow"}]. confidence est "green" (bonne visibilité), "yellow" (estimation approximative) ou "red" (information insuffisante). Ne donne jamais un poids unique et précis, toujours une fourchette.'}
      ]}]
    })
  });
  if(!resp.ok) throw new Error('requête API échouée ('+resp.status+')');
  const data = await resp.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('réponse vide');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  return parsed.map(p=>({name:p.name, qtyMinG:p.qtyMinG, qtyMaxG:p.qtyMaxG, confidence:p.confidence||'yellow'}));
}

function renderReviewItemHtml(it){

    : '<span class="badge badge-yellow">🟡 Estimation</span>';

  } else if(it.qtyMinG){

    </div>

function wireReviewEvents(){
  document.querySelectorAll('#reviewItems [data-act="del"]').forEach(b=>{
    b.addEventListener('click',()=>{
      photoState.reviewItems = photoState.reviewItems.filter(it=>it.id!==b.dataset.id);
      renderPhotoReview(document.getElementById('screen-photo'));
    });
  });
  document.querySelectorAll('#reviewItems [data-act="edit"]').forEach(b=>{
    b.addEventListener('click',()=>editReviewItem(b.dataset.id));
  });
}

function editReviewItem(id){
  const it = photoState.reviewItems.find(x=>x.id===id);
  const base = it.name.toLowerCase();
  const matches = allFoods().filter(f=>f.name.toLowerCase().includes(base.split(' ')[0].replace(/s$/,'')));
  const needsState = matches.length>1 && matches.some(m=>m.state);
  if(needsState && !it.foodId){
    showModal(`
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">${it.name}</div>
      <p class="small" style="margin-bottom:12px;">Pesé cru ou cuit ?</p>
      <div class="choice-row" id="editStateChoice">
        ${matches.map(m=>`<div class="choice-chip" data-id="${m.id}">${m.state}</div>`).join('')}
        <div class="choice-chip" data-id="__na">Je ne sais pas</div>
      </div>
    `, ()=>{
      document.querySelectorAll('#editStateChoice .choice-chip').forEach(chip=>{
        chip.addEventListener('click',()=>{
          const foodId = chip.dataset.id==='__na' ? matches[0].id : chip.dataset.id;
          closeModal();
          openQtyEditForItem(it, foodId);
        });
      });
    });
  } else {
    openQtyEditForItem(it, it.foodId || (matches[0] && matches[0].id));
  }
}
function openQtyEditForItem(it, foodId){
  const food = findFood(foodId);
  if(!food){ toast('Aliment non reconnu dans la base, ajoute-le manuellement'); return; }
  const qtyMid = it.qty || (it.qtyMinG && it.qtyMaxG ? Math.round((it.qtyMinG+it.qtyMaxG)/2) : 150);
  showModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${food.name}</div>
    <div class="field"><label>Quantité estimée (g)</label>
      <div class="qty-stepper"><button id="qm">−</button><input class="input" id="qi" type="number" value="${qtyMid}"><button id="qp">+</button></div>
    </div>
    <button class="btn btn-accent btn-block" id="qc">Mettre à jour</button>
  `,()=>{
    document.getElementById('qm').addEventListener('click',()=>{document.getElementById('qi').value=Math.max(0,(+document.getElementById('qi').value)-10);});
    document.getElementById('qp').addEventListener('click',()=>{document.getElementById('qi').value=(+document.getElementById('qi').value)+10;});
    document.getElementById('qc').addEventListener('click',()=>{
      it.foodId=food.id; it.name=food.name; it.qty=+document.getElementById('qi').value; it.unit='g'; it.state=food.state; it.confidence='green';
      closeModal();
      renderPhotoReview(document.getElementById('screen-photo'));
    });
  });
}

function updatePhotoTotal(){
  const items = photoState.reviewItems||[];
  let min=0,max=0,hasUnknown=false, exactCount=0, estCount=0;
  items.forEach(it=>{
    if(it.foodId){
      const g = it.qty; const food=findFood(it.foodId);
      const kcal = food.kcal*(g/100);
      min+=kcal*0.9; max+=kcal*1.1; exactCount++;
    } else if(it.qtyMinG){
      // approx 1.3kcal/g moyenne toutes familles confondues comme fallback grossier — affiché comme large fourchette
      min += it.qtyMinG*1.0; max += it.qtyMaxG*1.8; estCount++;
      it.estKcalRange = [Math.round(it.qtyMinG*1.0), Math.round(it.qtyMaxG*1.8)];
    } else { hasUnknown=true; }
  });
  const box = document.getElementById('photoTotalBox');
  if(!box) return;
  const confidence = hasUnknown ? 'red' : (estCount>0 ? 'yellow' : 'green');
  const badge = confidence==='green' ? '<span class="badge badge-green">🟢 Bonne estimation</span>' : confidence==='yellow' ? '<span class="badge badge-yellow">🟡 Estimation approximative</span>' : '<span class="badge badge-red">🔴 Informations insuffisantes</span>';
  box.innerHTML = `
    <div class="hero-kcal" style="font-size:30px;">🔥 ${round(min)}–${round(max)} kcal</div>
    <div class="confidence-line">${badge}</div>
    <p class="small" style="margin-top:8px;">${estCount>0?'Certaines quantités sont estimées à partir de la photo, pas pesées.':'Quantités saisies précisément.'}</p>
  `;
}

        return `<div class="meal-row"><div><div class="meal-name">${formatDate(d)}</div><div class="meal-items">P ${round(s.p)}g · G ${round(s.c)}g · L ${round(s.f)}g</div></div><div class="meal-kcal">${round(s.kcal)}<span class="u"> kcal</span></div></div>`;

function lastNDays(n){
  const arr=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const dd=new Date(d); dd.setDate(d.getDate()-i); arr.push(todayKey(dd)); }
  return arr;
}
function average(arr){ const f=arr.filter(x=>x>0); return f.length? f.reduce((a,b)=>a+b,0)/f.length : 0; }
function formatDate(key){ const [y,m,d]=key.split('-'); return d+'/'+m; }

function drawKcalChart(days){
  const canvas = document.getElementById('chartKcal'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth; const h = canvas.height = 160;
  ctx.clearRect(0,0,w,h);
  const values = days.map(d=>sumDay(d).kcal);
  const goal = STATE.profile.calorieGoal;
  const max = Math.max(goal*1.2, ...values, 1);
  const padL=8,padR=8,padB=20,padT=10;
  const stepX = (w-padL-padR)/(values.length-1||1);
  // goal line
  const goalY = h-padB-((goal/max)*(h-padB-padT));
  ctx.strokeStyle='#3a4150'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(padL,goalY); ctx.lineTo(w-padR,goalY); ctx.stroke(); ctx.setLineDash([]);
  // bars
  const barW = Math.min(18, stepX*0.5);
  values.forEach((v,i)=>{
    const x = padL + i*stepX;
    const barH = (v/max)*(h-padB-padT);
    const y = h-padB-barH;
    ctx.fillStyle = v>goal ? '#f87171' : '#34d399';
    ctx.beginPath();
    roundRectPath(ctx, x-barW/2, y, barW, barH, 4);
    ctx.fill();
  });
  ctx.fillStyle='#6b7280'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  days.forEach((d,i)=>{ if(i%2===0) ctx.fillText(formatDate(d), padL+i*stepX, h-6); });
}
function drawMacroChart(days){
  const canvas = document.getElementById('chartMacro'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth; const h = canvas.height = 160;
  ctx.clearRect(0,0,w,h);
  const series = {p:[],c:[],f:[]};
  days.forEach(d=>{ const s=sumDay(d); series.p.push(s.p); series.c.push(s.c); series.f.push(s.f); });
  const max = Math.max(1,...series.p,...series.c,...series.f)*1.15;
  const padL=8,padR=8,padB=20,padT=10;
  const stepX = (w-padL-padR)/(days.length-1||1);
  function drawLine(vals,color){
    ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
    vals.forEach((v,i)=>{ const x=padL+i*stepX; const y=h-padB-((v/max)*(h-padB-padT)); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
  }
  drawLine(series.p,'#60a5fa'); drawLine(series.c,'#fbbf24'); drawLine(series.f,'#c084fc');
  ctx.fillStyle='#6b7280'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  days.forEach((d,i)=>{ ctx.fillText(formatDate(d), padL+i*stepX, h-6); });
  // legend
  ctx.textAlign='left'; ctx.font='10.5px sans-serif';
  ctx.fillStyle='#60a5fa'; ctx.fillText('● Protéines', padL, 12);
  ctx.fillStyle='#fbbf24'; ctx.fillText('● Glucides', padL+80, 12);
  ctx.fillStyle='#c084fc'; ctx.fillText('● Lipides', padL+150, 12);
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function exportData(){

  a.href=url; a.download='mon-nutrition-coach-export.json'; a.click();

  toast('Export téléchargé');
}

/* ---- Recettes ---- */
let recipeDraft = {name:'', portions:4, items:[]};
function openRecipeBuilder(){
  recipeDraft = {name:'', portions:4, items:[]};
  renderRecipeModal();
}
function renderRecipeModal(){
  const total = recipeDraft.items.reduce((a,it)=>a+computeItemMacros(it).kcal,0);
  showModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">🍲 Nouvelle recette</div>
    <div class="field"><label>Nom de la recette</label><input class="input" id="recName" value="${recipeDraft.name}"></div>
    <div class="field"><label>Ingrédients</label>
      <input class="input" id="recFoodSearch" placeholder="Rechercher un ingrédient...">
      <div id="recSearchResults"></div>
    </div>
    <div id="recItemsList">
      ${recipeDraft.items.map((it,idx)=>`<div class="settings-row"><span class="lbl">${it.name} — ${it.qty}${it.unit==='unite'?'':' '+unitLabel(it.unit)}</span><span class="val">${round(computeItemMacros(it).kcal)} kcal <span class="icon-btn" style="display:inline-flex;width:24px;height:24px;font-size:12px;" data-idx="${idx}" data-act="delRec">🗑️</span></span></div>`).join('')}
    </div>
    <div class="settings-row"><span class="lbl">Total recette</span><span class="val" style="font-weight:800;color:var(--text)">${round(total)} kcal</span></div>
    <div class="field" style="margin-top:12px;"><label>Nombre de portions</label>
      <div class="qty-stepper"><button id="portMinus">−</button><input class="input" id="portInput" type="number" value="${recipeDraft.portions}"><button id="portPlus">+</button></div>
    </div>
    <p class="small" id="perPortionPreview">≈ ${round(total/recipeDraft.portions)} kcal / portion</p>
    <button class="btn btn-accent btn-block" style="margin-top:14px;" id="btnSaveRecipe">Enregistrer la recette</button>
  `, ()=>{
    document.getElementById('recName').addEventListener('input',e=>recipeDraft.name=e.target.value);
    const search = document.getElementById('recFoodSearch');
    search.addEventListener('input',()=>{
      const q=search.value.toLowerCase(); const box=document.getElementById('recSearchResults');
      if(q.length<2){box.innerHTML='';return;}
      const results = allFoods().filter(f=>f.name.toLowerCase().includes(q)).slice(0,6);
      box.innerHTML = results.map(f=>`<div class="search-result" data-id="${f.id}"><div class="srname">${f.name}</div><div class="icon-btn">➕</div></div>`).join('');
      box.querySelectorAll('.search-result').forEach(r=>{
        r.addEventListener('click',()=>{
          closeModal();
          openQuantityPicker(r.dataset.id, (item)=>{ recipeDraft.items.push(item); renderRecipeModal(); });
        });
      });
    });
    document.querySelectorAll('[data-act="delRec"]').forEach(b=>b.addEventListener('click',()=>{ recipeDraft.items.splice(+b.dataset.idx,1); renderRecipeModal(); }));
    const portInput=document.getElementById('portInput');
    function updatePortionPreview(){
      const t = recipeDraft.items.reduce((a,it)=>a+computeItemMacros(it).kcal,0);
      const port = parseFloat(portInput.value)||1;
      document.getElementById('perPortionPreview').textContent = `≈ ${round(t/port)} kcal / portion`;
    }
    document.getElementById('portMinus').addEventListener('click',()=>{portInput.value=Math.max(1,(+portInput.value)-1); updatePortionPreview();});
    document.getElementById('portPlus').addEventListener('click',()=>{portInput.value=(+portInput.value)+1; updatePortionPreview();});
    portInput.addEventListener('input',updatePortionPreview);
    document.getElementById('btnSaveRecipe').addEventListener('click',()=>{
      if(!recipeDraft.items.length){ toast('Ajoute au moins un ingrédient'); return; }
      const totalKcal = recipeDraft.items.reduce((a,it)=>a+computeItemMacros(it).kcal,0);
      const totalMac = recipeDraft.items.reduce((a,it)=>{const m=computeItemMacros(it);a.p+=m.p;a.c+=m.c;a.f+=m.f;a.fib+=m.fib;return a;},{p:0,c:0,f:0,fib:0});
      STATE.recipes.push({id:'rec_'+Date.now(), name:recipeDraft.name||'Ma recette', portions:parseFloat(portInput.value)||1, totalKcal, totalMac, items:recipeDraft.items});
      saveState(); closeModal(); toast('Recette enregistrée'); renderProfile();
    });
  });
}
